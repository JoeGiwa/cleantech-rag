[project]
name = "cleantech-rag"
version = "0.1.0"
description = "Agentic RAG system answering clean technology questions over CleanTech news, with web search, memory, and an evaluation suite"
readme = "README.md"
authors = [
    { name = "jgiwa", email = "jgiwa@depaul.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "openai>=3.40.0",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
cleantech-rag = "cleantech_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
eval = [
    "nltk>=3.9",
    "rouge-score>=0.1.2",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "nltk>=3.9",
    "rouge-score>=0.1.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
