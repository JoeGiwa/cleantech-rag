[project]
name = "cleantech-rag"
version = "0.1.0"
description = "Agentic RAG system answering clean technology questions over CleanTech news, with web search, memory, and an evaluation suite"
readme = "README.md"
authors = [
    { name = "jgiwa", email = "jgiwa@depaul.edu" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cleantech-rag = "cleantech_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
